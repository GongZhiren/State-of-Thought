[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "state-of-thought"
version = "1.0.0"
description = "Lightweight internal-state control for language and vision-language reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Zhiren Gong"},
  {name = "Yikun Hou"},
  {name = "Zihao Zeng"},
  {name = "Ming Xiao"},
  {name = "Chau Yuen"},
  {name = "Wei Yang Bryan Lim"},
]
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0",
  "torch>=2.2",
  "transformers>=4.51,<5",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
vlm = ["Pillow>=10"]
data = ["datasets>=3.0", "Pillow>=10"]
judge = ["joblib>=1.3", "scikit-learn>=1.3", "openai>=1.30"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8"]

[project.scripts]
sot = "sot.cli:main"

[project.urls]
Repository = "https://github.com/GongZhiren/State-of-Thought"
Homepage = "https://gongzhiren.github.io/SoT-website/"
Tutorial = "https://gongzhiren.github.io/SoT-website/tutorial.html"
Paper = "https://arxiv.org/abs/2609.16055"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
